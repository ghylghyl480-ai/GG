<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1DB954" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <title>Meu Player</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: #121212; color: #fff; height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 4px; padding: 10px 12px;
      background: linear-gradient(#1f2b22, #121212);
    }
    #backBtn { display: none; border: 0; background: none; color: #fff; font-size: 20px; padding: 6px; cursor: pointer; }
    header h1 { font-size: 17px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hbtn { border: 0; background: none; color: #fff; font-size: 19px; padding: 6px; cursor: pointer; }
    .hbtn.active { color: #1DB954; }
    #addBtn {
      background: #1DB954; color: #fff; border: 0; border-radius: 18px;
      padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; flex: none;
    }
    #list { flex: 1; overflow-y: auto; padding: 4px 12px 12px; }
    .track { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
    .track:active, .track.playing { background: #1f1f1f; }
    .track.playing .t-title { color: #1DB954; }
    .track img, .track .ph {
      width: 46px; height: 46px; border-radius: 6px; object-fit: cover; flex: none;
      background: #282828; display: flex; align-items: center; justify-content: center;
      font-size: 22px; color: #888;
    }
    .t-info { flex: 1; min-width: 0; }
    .t-title { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t-artist { font-size: 12px; color: #a7a7a7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t-dur { font-size: 12px; color: #a7a7a7; flex: none; }
    .t-btn { border: 0; background: none; color: #888; font-size: 17px; padding: 6px 4px; cursor: pointer; flex: none; }
    #empty { text-align: center; color: #a7a7a7; padding: 60px 30px; line-height: 1.6; }
    .folder {
      display: flex; align-items: center; gap: 14px; padding: 14px 10px;
      border-radius: 8px; cursor: pointer;
    }
    .folder:active { background: #1f1f1f; }
    .folder .fic { width: 46px; height: 46px; border-radius: 6px; background: #1f2b22; display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; }
    .f-info { flex: 1; min-width: 0; }
    .f-name { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .f-count { font-size: 12px; color: #a7a7a7; }
    #eqPanel {
      display: none; background: #181818; border-top: 1px solid #282828;
      padding: 12px 20px 4px;
    }
    #eqPanel.show { display: block; }
    .eq-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .eq-row label { width: 52px; font-size: 12px; color: #a7a7a7; flex: none; }
    .eq-row input { flex: 1; accent-color: #1DB954; }
    .eq-row .val { width: 44px; font-size: 11px; color: #a7a7a7; text-align: right; flex: none; }
    #eqReset { background: none; border: 0; color: #1DB954; font-size: 12px; padding: 2px 0 8px; cursor: pointer; }
    #bar {
      background: #181818; border-top: 1px solid #282828;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    }
    #bar-top { display: flex; align-items: center; gap: 10px; }
    #np-art { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: #282828; flex: none; }
    #np-info { flex: 1; min-width: 0; }
    #np-title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #np-artist { font-size: 12px; color: #a7a7a7; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctl { border: 0; background: none; color: #fff; font-size: 21px; cursor: pointer; padding: 8px; flex: none; }
    .ctl.off { color: #666; }
    #playBtn {
      width: 46px; height: 46px; border-radius: 50%; border: 0; background: #fff; color: #000;
      font-size: 20px; cursor: pointer; flex: none;
    }
    #seek-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    #seek { flex: 1; accent-color: #1DB954; height: 4px; }
    .time { font-size: 11px; color: #a7a7a7; min-width: 34px; text-align: center; }
    #modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      align-items: flex-end; z-index: 10;
    }
    #modal.show { display: flex; }
    #modal-box {
      background: #1f1f1f; width: 100%; border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
      max-height: 60dvh; overflow-y: auto;
    }
    #modal-box h3 { margin: 0 0 12px; font-size: 16px; }
    .m-item { padding: 13px 10px; border-radius: 8px; cursor: pointer; font-size: 15px; }
    .m-item:active { background: #2a2a2a; }
    .m-item.new { color: #1DB954; font-weight: 700; }
  
    /* CSS PRO TIPS (github.com/AllThingsSmitty/css-protips) */
    button, a, input, select, textarea, [role="button"] { touch-action: manipulation; }
    html, body { overscroll-behavior-y: contain; }
  </style>
</head>
<body>
  <header>
    <button id="backBtn">⬅</button>
    <h1 id="title">🎵 Meu Player</h1>
    <button class="hbtn" id="eqBtn" title="Equalizador">🎚️</button>
    <button class="hbtn" id="foldersBtn" title="Pastas">📚</button>
    <button id="addBtn">＋ Músicas</button>
    <input id="fileInput" type="file" accept="audio/*" multiple hidden />
  </header>
  <div id="list"></div>
  <div id="eqPanel">
    <div class="eq-row"><label>Baixo</label><input id="eq-low" type="range" min="-12" max="12" step="1" value="0" /><span class="val" id="v-low">0 dB</span></div>
    <div class="eq-row"><label>Médio</label><input id="eq-mid" type="range" min="-12" max="12" step="1" value="0" /><span class="val" id="v-mid">0 dB</span></div>
    <div class="eq-row"><label>Agudo</label><input id="eq-high" type="range" min="-12" max="12" step="1" value="0" /><span class="val" id="v-high">0 dB</span></div>
    <button id="eqReset">Zerar equalizador</button>
  </div>
  <div id="bar">
    <div id="bar-top">
      <img id="np-art" alt="" hidden />
      <div id="np-info"><div id="np-title">Nada tocando</div><div id="np-artist"></div></div>
      <button class="ctl" id="shuffleBtn" title="Aleatório">🔀</button>
      <button class="ctl" id="prevBtn" title="Anterior">⏮</button>
      <button id="playBtn" title="Tocar">▶</button>
      <button class="ctl" id="nextBtn" title="Próxima">⏭</button>
      <button class="ctl off" id="repeatBtn" title="Repetir">🔁</button>
    </div>
    <div id="seek-row">
      <span class="time" id="curTime">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" />
      <span class="time" id="totTime">0:00</span>
    </div>
  </div>
  <div id="modal"><div id="modal-box"><h3 id="modal-title"></h3><div id="modal-items"></div></div></div>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
    const $ = (id) => document.getElementById(id);
    const DB = "meu-player", STORE = "tracks", STORE2 = "playlists";
    let db, tracks = [], playlists = [];
    let view = { type: "all" };
    let current = -1, playingId = null;
    let shuffle = false, repeat = 0;
    const audio = new Audio();
    let objectUrl = null;

    function openDB() {
      return new Promise((res, rej) => {
        const r = indexedDB.open(DB, 2);
        r.onupgradeneeded = () => {
          const d = r.result;
          if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: "id" });
          if (!d.objectStoreNames.contains(STORE2)) d.createObjectStore(STORE2, { keyPath: "id" });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    }
    const tx = (store, mode, fn) => new Promise((res, rej) => {
      const t = db.transaction(store, mode);
      const out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && out.result);
      t.onerror = () => rej(t.error);
    });
    const idbAll = (s) => tx(s, "readonly", (o) => o.getAll());
    const idbPut = (s, rec) => tx(s, "readwrite", (o) => o.put(rec));
    const idbDel = (s, id) => tx(s, "readwrite", (o) => o.delete(id));

    function fmt(s) {
      if (!isFinite(s)) return "0:00";
      const m = Math.floor(s / 60), ss = Math.floor(s % 60);
      return m + ":" + String(ss).padStart(2, "0");
    }

    function decodeText(d) {
      const enc = d[0];
      const body = d.subarray(1);
      let label = "utf-8";
      if (enc === 0) label = "latin1";
      else if (enc === 1) label = "utf-16";
      else if (enc === 2) label = "utf-16be";
      let text = new TextDecoder(label).decode(body);
      return text.replace(/\0+$/g, "").replace(/^\uFEFF/, "").trim();
    }

    function parseApic(d) {
      try {
        const enc = d[0];
        let i = 1;
        while (i < d.length && d[i] !== 0) i++;
        const mime = String.fromCharCode.apply(null, d.subarray(1, i)) || "image/jpeg";
        i++;
        i++;
        if (enc === 1 || enc === 2) {
          while (i + 1 < d.length && !(d[i] === 0 && d[i + 1] === 0)) i += 2;
          i += 2;
        } else {
          while (i < d.length && d[i] !== 0) i++;
          i++;
        }
        if (i >= d.length) return null;
        return new Blob([d.subarray(i)], { type: mime });
      } catch { return null; }
    }

    async function parseTags(file) {
      try {
        const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
        if (head[0] !== 0x49 || head[1] !== 0x44 || head[2] !== 0x33) return {};
        const ver = head[3];
        const size = ((head[6] & 0x7f) << 21) | ((head[7] & 0x7f) << 14) | ((head[8] & 0x7f) << 7) | (head[9] & 0x7f);
        const buf = new Uint8Array(await file.slice(10, 10 + Math.min(size, 3 * 1024 * 1024)).arrayBuffer());
        const out = {};
        let p = 0;
        while (p + 10 <= buf.length) {
          const id = String.fromCharCode(buf[p], buf[p + 1], buf[p + 2], buf[p + 3]);
          if (!/^[A-Z0-9]{4}$/.test(id)) break;
          let fsize;
          if (ver >= 4) fsize = ((buf[p + 4] & 0x7f) << 21) | ((buf[p + 5] & 0x7f) << 14) | ((buf[p + 6] & 0x7f) << 7) | (buf[p + 7] & 0x7f);
          else fsize = (buf[p + 4] << 24) | (buf[p + 5] << 16) | (buf[p + 6] << 8) | buf[p + 7];
          if (fsize <= 0 || p + 10 + fsize > buf.length) break;
          const data = buf.subarray(p + 10, p + 10 + fsize);
          if (id === "TIT2") out.title = decodeText(data);
          else if (id === "TPE1") out.artist = decodeText(data);
          else if (id === "TALB") out.album = decodeText(data);
          else if (id === "APIC" && !out.art) out.art = parseApic(data);
          p += 10 + fsize;
        }
        return out;
      } catch { return {}; }
    }

    function probeDuration(blob) {
      return new Promise((res) => {
        const a = new Audio();
        const u = URL.createObjectURL(blob);
        a.preload = "metadata";
        a.onloadedmetadata = () => { URL.revokeObjectURL(u); res(a.duration || 0); };
        a.onerror = () => { URL.revokeObjectURL(u); res(0); };
        a.src = u;
      });
    }

    function cleanName(name) {
      return name.replace(/\.[^.]+$/, "").replace(/_/g, " ").trim();
    }

    async function addFiles(files) {
      for (const file of files) {
        if (!file.type.startsWith("audio") && !/\.(mp3|m4a|ogg|wav|flac|aac|opus)$/i.test(file.name)) continue;
        const tags = await parseTags(file);
        const rec = {
          id: crypto.randomUUID(),
          name: file.name,
          blob: file,
          title: tags.title || cleanName(file.name),
          artist: tags.artist || "Artista desconhecido",
          album: tags.album || "",
          art: tags.art || null,
          duration: await probeDuration(file),
        };
        await idbPut(STORE, rec);
        tracks.push(rec);
        render();
      }
    }

    function currentQueue() {
      if (view.type === "playlist") {
        const pl = playlists.find((p) => p.id === view.id);
        return pl ? pl.trackIds.map((id) => tracks.find((t) => t.id === id)).filter(Boolean) : [];
      }
      return tracks;
    }

    function render() {
      const list = $("list");
      list.innerHTML = "";
      const back = $("backBtn");
      if (view.type === "all") {
        $("title").textContent = "🎵 Meu Player";
        back.style.display = "none";
        $("foldersBtn").classList.remove("active");
      } else if (view.type === "playlists") {
        $("title").textContent = "📚 Pastas";
        back.style.display = "block";
        $("foldersBtn").classList.add("active");
      } else {
        const pl = playlists.find((p) => p.id === view.id);
        $("title").textContent = "📁 " + (pl ? pl.name : "?");
        back.style.display = "block";
        $("foldersBtn").classList.remove("active");
      }

      if (view.type === "playlists") {
        const newF = document.createElement("div");
        newF.className = "folder";
        newF.innerHTML = '<div class="fic">➕</div><div class="f-info"><div class="f-name" style="color:#1DB954;font-weight:700">Criar nova pasta</div></div>';
        newF.onclick = createPlaylist;
        list.appendChild(newF);
        playlists.forEach((pl) => {
          const row = document.createElement("div");
          row.className = "folder";
          const ic = document.createElement("div");
          ic.className = "fic";
          ic.textContent = "📁";
          const info = document.createElement("div");
          info.className = "f-info";
          info.innerHTML = '<div class="f-name"></div><div class="f-count"></div>';
          info.querySelector(".f-name").textContent = pl.name;
          info.querySelector(".f-count").textContent = pl.trackIds.length + (pl.trackIds.length === 1 ? " música" : " músicas");
          const del = document.createElement("button");
          del.className = "t-btn";
          del.textContent = "✕";
          del.onclick = (e) => { e.stopPropagation(); deletePlaylist(pl.id); };
          row.append(ic, info, del);
          row.onclick = () => { view = { type: "playlist", id: pl.id }; render(); };
          list.appendChild(row);
        });
        if (playlists.length === 0) {
          const e = document.createElement("div");
          e.id = "empty";
          e.innerHTML = "Nenhuma pasta ainda.<br />Toque em <b>Criar nova pasta</b>.";
          list.appendChild(e);
        }
        return;
      }

      const q = currentQueue();
      if (q.length === 0) {
        const e = document.createElement("div");
        e.id = "empty";
        e.innerHTML = view.type === "playlist"
          ? "Esta pasta está vazia.<br />Volte, toque no <b>⋯</b> de uma música<br />e escolha <b>Adicionar à pasta</b>."
          : "Sua biblioteca está vazia.<br />Toque em <b>＋ Músicas</b> e escolha os MP3s.<br />Eles ficam salvos aqui.";
        list.appendChild(e);
        return;
      }
      q.forEach((t, i) => {
        const row = document.createElement("div");
        row.className = "track" + (t.id === playingId ? " playing" : "");
        const thumb = t.art ? Object.assign(document.createElement("img"), { src: URL.createObjectURL(t.art), alt: "" })
                            : Object.assign(document.createElement("div"), { className: "ph", textContent: "♪" });
        const info = document.createElement("div");
        info.className = "t-info";
        info.innerHTML = '<div class="t-title"></div><div class="t-artist"></div>';
        info.querySelector(".t-title").textContent = t.title;
        info.querySelector(".t-artist").textContent = t.artist;
        const dur = document.createElement("span");
        dur.className = "t-dur";
        dur.textContent = fmt(t.duration);
        const more = document.createElement("button");
        more.className = "t-btn";
        more.textContent = "⋯";
        more.onclick = (e) => { e.stopPropagation(); openMenu(t, i); };
        row.append(thumb, info, dur, more);
        row.onclick = () => playIndex(i);
        list.appendChild(row);
      });
    }

    function openMenu(t) {
      const items = $("modal-items");
      items.innerHTML = "";
      $("modal-title").textContent = t.title;
      if (view.type !== "playlist") {
        const add = document.createElement("div");
        add.className = "m-item";
        add.textContent = "📁 Adicionar à pasta...";
        add.onclick = () => { closeModal(); openAddToFolder(t); };
        items.appendChild(add);
      } else {
        const rm = document.createElement("div");
        rm.className = "m-item";
        rm.textContent = "↩ Remover desta pasta";
        rm.onclick = () => { closeModal(); removeFromPlaylist(view.id, t.id); };
        items.appendChild(rm);
      }
      const del = document.createElement("div");
      del.className = "m-item";
      del.style.color = "#ff6b6b";
      del.textContent = "🗑 Apagar do aparelho";
      del.onclick = () => { closeModal(); removeTrack(t.id); };
      items.appendChild(del);
      const cancel = document.createElement("div");
      cancel.className = "m-item";
      cancel.style.color = "#888";
      cancel.textContent = "Cancelar";
      cancel.onclick = closeModal;
      items.appendChild(cancel);
      $("modal").classList.add("show");
    }

    function openAddToFolder(t) {
      const items = $("modal-items");
      items.innerHTML = "";
      $("modal-title").textContent = "Adicionar a qual pasta?";
      playlists.forEach((pl) => {
        const it = document.createElement("div");
        it.className = "m-item";
        it.textContent = "📁 " + pl.name + (pl.trackIds.includes(t.id) ? " ✓" : "");
        it.onclick = () => { closeModal(); addToPlaylist(pl.id, t.id); };
        items.appendChild(it);
      });
      const nw = document.createElement("div");
      nw.className = "m-item new";
      nw.textContent = "➕ Criar nova pasta";
      nw.onclick = () => { closeModal(); createPlaylist(t.id); };
      items.appendChild(nw);
      const cancel = document.createElement("div");
      cancel.className = "m-item";
      cancel.style.color = "#888";
      cancel.textContent = "Cancelar";
      cancel.onclick = closeModal;
      items.appendChild(cancel);
      $("modal").classList.add("show");
    }

    const closeModal = () => $("modal").classList.remove("show");
    $("modal").onclick = (e) => { if (e.target.id === "modal") closeModal(); };

    async function createPlaylist(firstTrackId) {
      const name = prompt("Nome da pasta:", "");
      if (!name || !name.trim()) return;
      const pl = { id: crypto.randomUUID(), name: name.trim(), trackIds: firstTrackId ? [firstTrackId] : [] };
      await idbPut(STORE2, pl);
      playlists.push(pl);
      view = { type: "playlist", id: pl.id };
      render();
    }

    async function deletePlaylist(id) {
      if (!confirm("Apagar esta pasta? (as músicas continuam salvas)")) return;
      await idbDel(STORE2, id);
      playlists = playlists.filter((p) => p.id !== id);
      if (view.type === "playlist" && view.id === id) view = { type: "playlists" };
      render();
    }

    async function addToPlaylist(plId, trackId) {
      const pl = playlists.find((p) => p.id === plId);
      if (!pl || pl.trackIds.includes(trackId)) return;
      pl.trackIds.push(trackId);
      await idbPut(STORE2, pl);
      render();
    }

    async function removeFromPlaylist(plId, trackId) {
      const pl = playlists.find((p) => p.id === plId);
      if (!pl) return;
      pl.trackIds = pl.trackIds.filter((id) => id !== trackId);
      await idbPut(STORE2, pl);
      if (playingId === trackId && view.type === "playlist") current = currentQueue().findIndex((t) => t.id === playingId);
      render();
    }

    async function removeTrack(id) {
      const idx = tracks.findIndex((t) => t.id === id);
      if (idx === -1) return;
      if (playingId === id) { audio.pause(); audio.removeAttribute("src"); playingId = null; current = -1; updateBar(); }
      await idbDel(STORE, id);
      tracks.splice(idx, 1);
      for (const pl of playlists) {
        if (pl.trackIds.includes(id)) {
          pl.trackIds = pl.trackIds.filter((x) => x !== id);
          await idbPut(STORE2, pl);
        }
      }
      render();
    }

    function updateBar() {
      const t = currentQueue()[current];
      if (!t) {
        $("np-title").textContent = "Nada tocando";
        $("np-artist").textContent = "";
        $("np-art").hidden = true;
        $("playBtn").textContent = "▶";
        return;
      }
      $("np-title").textContent = t.title;
      $("np-artist").textContent = t.artist;
      const art = $("np-art");
      if (t.art) { art.src = URL.createObjectURL(t.art); art.hidden = false; }
      else art.hidden = true;
      $("playBtn").textContent = audio.paused ? "▶" : "⏸";
      if ("mediaSession" in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: t.title, artist: t.artist, album: t.album || "Meu Player",
          artwork: t.art ? [{ src: URL.createObjectURL(t.art) }] : [],
        });
      }
    }

    function playIndex(i) {
      const q = currentQueue();
      if (i < 0 || i >= q.length) return;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      const t = q[i];
      current = i;
      playingId = t.id;
      objectUrl = URL.createObjectURL(t.blob);
      audio.src = objectUrl;
      setupEQ();
      audio.play();
      updateBar();
      render();
    }

    function nextIndex(dir) {
      const n = currentQueue().length;
      if (n === 0) return -1;
      if (shuffle && n > 1) {
        let r;
        do { r = Math.floor(Math.random() * n); } while (r === current);
        return r;
      }
      return (current + dir + n) % n;
    }

    let actx = null, filters = null;
    function setupEQ() {
      try {
        if (!actx) {
          actx = new (window.AudioContext || window.webkitAudioContext)();
          const src = actx.createMediaElementSource(audio);
          const low = actx.createBiquadFilter();
          low.type = "lowshelf"; low.frequency.value = 200;
          const mid = actx.createBiquadFilter();
          mid.type = "peaking"; mid.frequency.value = 1000; mid.Q.value = 1;
          const high = actx.createBiquadFilter();
          high.type = "highshelf"; high.frequency.value = 4000;
          filters = [low, mid, high];
          src.connect(low); low.connect(mid); mid.connect(high); high.connect(actx.destination);
          applyEQ();
        }
        if (actx.state === "suspended") actx.resume();
      } catch {}
    }

    function eqValues() {
      try { return JSON.parse(localStorage.getItem("eq") || "[0,0,0]"); } catch { return [0, 0, 0]; }
    }
    function applyEQ() {
      const vals = [$("eq-low").value, $("eq-mid").value, $("eq-high").value];
      ["low", "mid", "high"].forEach((k, i) => $("v-" + k).textContent = vals[i] + " dB");
      if (filters) filters.forEach((f, i) => f.gain.value = parseFloat(vals[i]));
      localStorage.setItem("eq", JSON.stringify(vals.map(Number)));
    }
    ["eq-low", "eq-mid", "eq-high"].forEach((id) => $(id).addEventListener("input", applyEQ));
    $("eqReset").onclick = () => {
      $("eq-low").value = 0; $("eq-mid").value = 0; $("eq-high").value = 0;
      applyEQ();
    };
    (function initEQ() {
      const v = eqValues();
      $("eq-low").value = v[0]; $("eq-mid").value = v[1]; $("eq-high").value = v[2];
    })();
    $("eqBtn").onclick = () => $("eqPanel").classList.toggle("show");
    $("foldersBtn").onclick = () => {
      view = view.type === "playlists" ? { type: "all" } : { type: "playlists" };
      render();
    };
    $("backBtn").onclick = () => {
      view = view.type === "playlist" ? { type: "playlists" } : { type: "all" };
      render();
    };

    $("addBtn").onclick = () => $("fileInput").click();
    $("fileInput").onchange = (e) => { addFiles([...e.target.files]); e.target.value = ""; };
    $("playBtn").onclick = () => {
      if (current === -1) { if (currentQueue().length) playIndex(0); return; }
      setupEQ();
      audio.paused ? audio.play() : audio.pause();
    };
    $("nextBtn").onclick = () => playIndex(nextIndex(1));
    $("prevBtn").onclick = () => {
      if (audio.currentTime > 3) { audio.currentTime = 0; return; }
      playIndex(nextIndex(-1));
    };
    $("shuffleBtn").onclick = () => {
      shuffle = !shuffle;
      $("shuffleBtn").classList.toggle("off", !shuffle);
    };
    $("repeatBtn").onclick = () => {
      repeat = (repeat + 1) % 3;
      $("repeatBtn").classList.toggle("off", repeat === 0);
      $("repeatBtn").textContent = repeat === 2 ? "🔂" : "🔁";
    };
    $("seek").oninput = (e) => {
      if (isFinite(audio.duration)) audio.currentTime = (e.target.value / 1000) * audio.duration;
    };
    audio.ontimeupdate = () => {
      if (!isFinite(audio.duration)) return;
      $("seek").value = Math.floor((audio.currentTime / audio.duration) * 1000);
      $("curTime").textContent = fmt(audio.currentTime);
      $("totTime").textContent = fmt(audio.duration);
    };
    audio.onplay = () => { $("playBtn").textContent = "⏸"; };
    audio.onpause = () => { $("playBtn").textContent = "▶"; };
    audio.onended = () => {
      if (repeat === 2) { audio.currentTime = 0; audio.play(); return; }
      const n = nextIndex(1);
      if (n !== -1) playIndex(n);
    };
    if ("mediaSession" in navigator) {
      navigator.mediaSession.setActionHandler("play", () => audio.play());
      navigator.mediaSession.setActionHandler("pause", () => audio.pause());
      navigator.mediaSession.setActionHandler("previoustrack", () => playIndex(nextIndex(-1)));
      navigator.mediaSession.setActionHandler("nexttrack", () => playIndex(nextIndex(1)));
    }

    openDB().then(async (d) => {
      db = d;
      tracks = await idbAll(STORE);
      playlists = await idbAll(STORE2);
      render();
    });
  </script>
</body>
</html>
