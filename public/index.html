<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chat Mistral</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: #0f1117; color: #e6e6e6; height: 100dvh;
      display: flex; flex-direction: column;
    }
    header { padding: 12px 16px; border-bottom: 1px solid #23263a; font-weight: 600; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.5; }
    .user { align-self: flex-end; background: #2b5cff; color: #fff; }
    .assistant { align-self: flex-start; background: #1c1f2e; }
    .assistant.error { background: #3a1c24; color: #ff9aa8; }
    form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #23263a; }
    input {
      flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #2c3047;
      background: #171a26; color: #e6e6e6; font-size: 15px;
    }
    button {
      padding: 12px 20px; border: 0; border-radius: 8px; background: #2b5cff;
      color: #fff; font-size: 15px; cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <header>Chat Mistral <small style="color:#888">(mistral-small-latest)</small></header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="Digite sua mensagem..." autocomplete="off" />
    <button id="send">Enviar</button>
  </form>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const history = [];

    function addMsg(role, text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + (cls || role);
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      send.disabled = true;
      addMsg("user", text);
      history.push({ role: "user", content: text });

      const bubble = addMsg("assistant", "");
      let full = "";
      try {
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages: history }),
        });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n\n");
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const payload = line.slice(6);
            if (payload === "[DONE]") continue;
            const data = JSON.parse(payload);
            if (data.error) {
              bubble.className = "msg assistant error";
              bubble.textContent = data.error;
            } else if (data.delta) {
              full += data.delta;
              bubble.textContent = full;
              chat.scrollTop = chat.scrollHeight;
            }
          }
        }
        history.push({ role: "assistant", content: full });
      } catch {
        bubble.className = "msg assistant error";
        bubble.textContent = "Erro de conexão com o servidor.";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
