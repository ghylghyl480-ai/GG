<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a9e4b" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <title>FitBot IA</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: #0e1512; color: #e9f2ec; height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 10px; padding: 12px 16px;
      background: linear-gradient(#14361f, #0e1512); border-bottom: 1px solid #1d3325;
    }
    header h1 { font-size: 18px; margin: 0; flex: 1; }
    header button { background: none; border: 0; color: #7ddba3; font-size: 17px; cursor: pointer; padding: 6px; }
    #goal {
      display: none; background: #12211a; padding: 14px 16px; border-bottom: 1px solid #1d3325;
    }
    #goal.show { display: block; }
    .g-row { display: flex; gap: 8px; }
    .g-row div { flex: 1; }
    .g-row label { font-size: 11px; color: #7ddba3; display: block; margin-bottom: 4px; }
    .g-row input {
      width: 100%; padding: 9px; border-radius: 8px; border: 1px solid #244433;
      background: #0e1512; color: #fff; font-size: 14px;
    }
    #goalSave {
      width: 100%; margin-top: 10px; padding: 11px; border: 0; border-radius: 8px;
      background: #1a9e4b; color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    }
    #status {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 16px; background: #12211a; border-bottom: 1px solid #1d3325; font-size: 12px; color: #7ddba3;
    }
    #status b { color: #fff; }
    #chat { flex: 1; overflow-y: auto; padding: 14px 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; line-height: 1.5; font-size: 14.5px; }
    .user { align-self: flex-end; background: #1a9e4b; color: #fff; border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: #16241d; border: 1px solid #244433; border-bottom-left-radius: 4px; }
    .assistant.error { background: #3a1c24; color: #ff9aa8; border-color: #5a2a35; }
    .typing { color: #888; font-style: italic; }
    form { display: flex; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #1d3325; }
    input#input {
      flex: 1; padding: 13px; border-radius: 22px; border: 1px solid #244433;
      background: #12211a; color: #e9f2ec; font-size: 15px;
    }
    button#send {
      width: 46px; height: 46px; border-radius: 50%; border: 0; background: #1a9e4b;
      color: #fff; font-size: 18px; cursor: pointer; flex: none;
    }
    button#send:disabled { opacity: 0.5; }
    #setup {
      display: none; flex: 1; flex-direction: column; justify-content: center;
      padding: 32px 24px; gap: 14px; text-align: center;
    }
    #setup h2 { font-size: 22px; margin: 0; }
    #setup p { color: #7ddba3; font-size: 14px; line-height: 1.6; margin: 0; }
    #setup a { color: #4ade80; }
    #keyInput {
      padding: 14px; border-radius: 10px; border: 1px solid #244433;
      background: #12211a; color: #fff; font-size: 15px; width: 100%;
    }
    #saveKey {
      padding: 14px; border: 0; border-radius: 10px; background: #1a9e4b;
      color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>🥗 FitBot IA</h1>
    <button id="goalBtn" title="Minha meta">⚖️</button>
    <button id="keyBtn" title="Chave da API">🔑</button>
  </header>
  <div id="goal">
    <div class="g-row">
      <div><label>PESO ATUAL (kg)</label><input id="pesoAtual" type="number" inputmode="decimal" placeholder="Ex: 90" /></div>
      <div><label>PESO META (kg)</label><input id="pesoMeta" type="number" inputmode="decimal" placeholder="Ex: 80" /></div>
      <div><label>CALORIAS/DIA</label><input id="metaCal" type="number" inputmode="numeric" placeholder="1800" /></div>
    </div>
    <button id="goalSave">Salvar meta</button>
  </div>
  <div id="status"><span id="s-left">Defina sua meta ⚖️</span><span id="s-eaten">Hoje: <b>0 cal</b></span></div>
  <div id="setup">
    <h2>Bem-vindo ao FitBot IA!</h2>
    <p>Me fala o que tem em casa que eu monto a receita.<br />Me conta o que você comeu que eu conto as calorias.<br /><br />
    Para funcionar, cole sua chave da API da Mistral em<br /><a href="https://console.mistral.ai" target="_blank" rel="noopener">console.mistral.ai</a> → API Keys.</p>
    <input id="keyInput" type="password" placeholder="Cole sua chave aqui" />
    <button id="saveKey">Salvar e começar</button>
  </div>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="Ex: só tenho ovo, cuscuz e tomate" autocomplete="off" />
    <button id="send">➤</button>
  </form>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
    const $ = (id) => document.getElementById(id);
    const API = "https://api.mistral.ai/v1/chat/completions";
    const MODEL = "mistral-small-latest";
    const SYSTEM = [
      "Você é o FitBot IA, um amigo brasileiro que ajuda com dieta de verdade, falando português informal (tipo 'beleza', 'firmeza').",
      "REGRAS:",
      "1. Se o usuário disser o que TEM EM CASA, monte uma receita simples com EXATAMENTE esses ingredientes (pode sugerir sal, água e temperos básicos). Formato: nome da receita, ingredientes com quantidades, modo de preparo em passos numerados curtos, e estimativa de calorias da porção.",
      "2. Se o usuário disser o que COMEU, estime as calorias de forma realista, some ao total do dia e diga quanto falta para a meta de calorias.",
      "3. Use o peso atual e a meta de peso do usuário para dar dicas curtas e motivadoras, sem ser repetitivo.",
      "4. Seja CURTO e direto. Use emojis com moderação. Nada de textões.",
      "5. Se faltar informação (não disse o que tem nem o que comeu), faça UMA pergunta curta.",
      "6. Nunca prescreva remédios nem dietas médicas restritivas; se o assunto for sério (doença, gravidez), recomende um nutricionista ou médico.",
      "7. Nunca invente que comeu ou anotou algo sem o usuário ter dito."
    ].join("\n");
    let history = [];

    function today() { return new Date().toISOString().slice(0, 10); }
    function getGoal() {
      try { return JSON.parse(localStorage.getItem("fitbot-goal") || "null"); } catch { return null; }
    }
    function getEaten() {
      const raw = localStorage.getItem("fitbot-eaten");
      if (!raw) return 0;
      try { const d = JSON.parse(raw); return d.date === today() ? d.kcal : 0; } catch { return 0; }
    }
    function addEaten(kcal) {
      localStorage.setItem("fitbot-eaten", JSON.stringify({ date: today(), kcal: Math.round(getEaten() + kcal) }));
      updateStatus();
    }
    function ctxLine() {
      const g = getGoal();
      let s = "";
      if (g) {
        s += "DADOS DO USUÁRIO: peso atual " + g.peso + "kg, meta " + g.meta + "kg, meta de " + g.cal + " cal/dia. ";
      } else {
        s += "DADOS DO USUÁRIO: ainda não definiu peso/meta. Se relevante, pergunte o peso e a meta UMA vez. ";
      }
      s += "Já consumiu hoje: " + getEaten() + " cal (conteúdo do dia). Quando estimar calorias do que ele comeu, SEMPRE informe o valor e atualize mentalmente esse total.";
      return s;
    }
    function updateStatus() {
      const g = getGoal();
      const eaten = getEaten();
      $("s-eaten").innerHTML = "Hoje: <b>" + eaten + " cal</b>";
      if (g) {
        const falt = Math.max(0, g.peso - g.meta);
        $("s-left").innerHTML = "<b>" + g.peso + "kg</b> → meta <b>" + g.meta + "kg</b> (" + falt + "kg) · " + g.cal + " cal/dia";
      } else {
        $("s-left").textContent = "Defina sua meta ⚖️";
      }
    }

    function load() {
      try {
        history = JSON.parse(localStorage.getItem("fitbot-history") || "[]");
      } catch { history = []; }
      history.forEach((m) => addMsg(m.role, m.content));
      if (history.length) $("chat").scrollTop = $("chat").scrollHeight;
    }
    function save() { localStorage.setItem("fitbot-history", JSON.stringify(history.slice(-40))); }

    function addMsg(role, text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + (cls || role);
      div.textContent = text;
      $("chat").appendChild(div);
      $("chat").scrollTop = $("chat").scrollHeight;
      return div;
    }

    function showSetup(show) {
      $("setup").style.display = show ? "flex" : "none";
      $("chat").style.display = show ? "none" : "flex";
      $("form").style.display = show ? "none" : "flex";
      if (show) $("keyInput").focus();
    }
    function getKey() { return localStorage.getItem("mistral-key"); }

    function openGoal() {
      const g = getGoal();
      $("goal").classList.toggle("show");
      if (g) { $("pesoAtual").value = g.peso; $("pesoMeta").value = g.meta; $("metaCal").value = g.cal; }
    }
    $("goalBtn").onclick = openGoal;
    $("goalSave").onclick = () => {
      const p = parseFloat($("pesoAtual").value), m = parseFloat($("pesoMeta").value), c = parseInt($("metaCal").value) || 1800;
      if (!p || !m) { alert("Preencha peso atual e meta."); return; }
      localStorage.setItem("fitbot-goal", JSON.stringify({ peso: p, meta: m, cal: c }));
      $("goal").classList.remove("show");
      updateStatus();
      if (!history.length) addMsg("assistant", "Fechou! Meta salva: " + p + "kg → " + m + "kg, " + c + " cal/dia. Agora me fala: o que tu tem em casa ou o que tu comeu hoje?");
    };
    $("keyBtn").onclick = () => { $("keyInput").value = getKey() || ""; showSetup(true); };
    $("saveKey").onclick = () => {
      const k = $("keyInput").value.trim();
      if (!k) return;
      localStorage.setItem("mistral-key", k);
      showSetup(false);
    };

    async function send(text) {
      const key = getKey();
      if (!key) { showSetup(true); return; }
      addMsg("user", text);
      history.push({ role: "user", content: text });
      save();
      $("input").value = "";
      $("send").disabled = true;

      const bubble = addMsg("assistant", "pensando...", "assistant typing");
      let full = "";
      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
          body: JSON.stringify({
            model: MODEL,
            messages: [{ role: "system", content: SYSTEM + "\n\n" + ctxLine() }, ...history.slice(-20)],
            stream: true,
          }),
        });
        if (res.status === 401) throw new Error("Chave inválida ou expirada. Gera outra grátis em console.mistral.ai (API Keys → Create new key) e cola no 🔑.");
        if (res.status === 429) throw new Error("Limite grátis da Mistral estourou agora. Espera uns minutos e manda de novo.");
        if (!res.ok) throw new Error("Erro da API (" + res.status + "). Tente de novo.");
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split("\n");
          buffer = parts.pop();
          for (const line of parts) {
            const t = line.trim();
            if (!t.startsWith("data:")) continue;
            const payload = t.slice(5).trim();
            if (payload === "[DONE]") continue;
            try {
              const delta = JSON.parse(payload).choices?.[0]?.delta?.content;
              if (delta) full += delta;
            } catch {}
          }
          if (full) {
            bubble.className = "msg assistant";
            bubble.textContent = full;
            $("chat").scrollTop = $("chat").scrollHeight;
          }
        }
        if (!full) throw new Error("Resposta vazia. Tente de novo.");
        history.push({ role: "assistant", content: full });
        save();
        const m = full.match(/(\d{2,4})\s*(?:k?cal|calorias)/i);
        if (m && /comeu|anot|anotei|total|falta/i.test(full)) addEaten(parseInt(m[1]));
      } catch (err) {
        bubble.className = "msg assistant error";
        bubble.textContent = err.message || "Erro de conexão.";
      } finally {
        $("send").disabled = false;
        $("input").focus();
      }
    }

    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = $("input").value.trim();
      if (text) send(text);
    });

    if (getKey()) showSetup(false); else showSetup(true);
    updateStatus();
    load();
    if (!history.length && getGoal()) {
      addMsg("assistant", "Salve! Qual é o plano hoje: me diz o que tem em casa que eu monto a receita, ou me conta o que comeu que eu anoto as calorias. 💪");
    }
  </script>
</body>
</html>
