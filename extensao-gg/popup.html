<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 260px; font-family: system-ui, sans-serif; background: #12121a; color: #fff; padding: 14px; }
    h1 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    h1 span { color: #7c3aed; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button {
      padding: 10px 8px; border: 1px solid #2a2140; border-radius: 10px;
      background: #1a1526; color: #fff; font-size: 12.5px; font-weight: 700;
      cursor: pointer; text-align: left; line-height: 1.3;
    }
    button:hover { background: #241b38; border-color: #7c3aed; }
    button .em { display: block; font-size: 18px; margin-bottom: 4px; }
    .hub { grid-column: 1 / -1; background: #7c3aed; border-color: #7c3aed; text-align: center; font-size: 13.5px; padding: 12px; }
    .hub:hover { background: #8b5cf6; }
    p { font-size: 10.5px; color: #8d84a8; text-align: center; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>⚡ GG <span>Apps</span></h1>
  <div class="grid" id="grid"></div>
  <p>ghylghyl480-ai.github.io/GG</p>
  <script src="popup.js"></script>
</body>
</html>
