<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#7c3aed" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <title>Meu Time IA</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; font-family: system-ui, -apple-system, sans-serif;
      background: #0d0b14; color: #ece9f5; height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      display: flex; align-items: center; gap: 4px; padding: 12px 14px;
      background: linear-gradient(#221539, #0d0b14); border-bottom: 1px solid #2a2140;
    }
    header h1 { font-size: 17px; margin: 0; flex: 1; }
    header button { background: none; border: 0; color: #b79aec; font-size: 17px; cursor: pointer; padding: 6px; }
    header button.on { color: #4ade80; }
    #setup {
      display: none; flex: 1; overflow-y: auto; padding: 28px 22px; text-align: center;
    }
    #setup.show { display: block; }
    #setup h2 { margin: 0 0 8px; font-size: 22px; }
    #setup p { color: #b79aec; font-size: 13.5px; line-height: 1.6; margin: 0 0 16px; }
    #setup a { color: #a78bfa; }
    #keyInput {
      width: 100%; padding: 13px; border-radius: 10px; border: 1px solid #2a2140;
      background: #171225; color: #fff; font-size: 15px; margin-bottom: 10px;
    }
    #saveKey {
      width: 100%; padding: 13px; border: 0; border-radius: 10px; background: #7c3aed;
      color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 22px;
    }
    .bot-pick {
      display: flex; align-items: center; gap: 12px; text-align: left;
      background: #171225; border: 1px solid #2a2140; border-radius: 10px;
      padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
    }
    .bot-pick.on { border-color: #7c3aed; background: #1e1533; }
    .bot-pick input { width: 18px; height: 18px; accent-color: #7c3aed; flex: none; }
    .bp-name { font-weight: 700; font-size: 15px; }
    .bp-desc { font-size: 12px; color: #8d84a8; }
    #startChat {
      width: 100%; padding: 14px; margin-top: 14px; border: 0; border-radius: 10px;
      background: #7c3aed; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
    }
    #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 88%; padding: 9px 13px; border-radius: 13px; white-space: pre-wrap; line-height: 1.5; font-size: 14px; border-left: 3px solid #555; }
    .msg .who { display: block; font-size: 11px; font-weight: 700; margin-bottom: 3px; opacity: 0.9; }
    .msg.user { align-self: flex-end; background: #7c3aed; color: #fff; border-left-color: #7c3aed; border-radius: 13px 13px 4px 13px; }
    .msg.bot { align-self: flex-start; background: #171225; border-bottom-left-radius: 4px; }
    .msg.bot.typing { color: #888; font-style: italic; }
    .msg.bot.error { background: #3a1c24; color: #ff9aa8; }
    .msg.image { align-self: flex-start; background: #171225; padding: 8px; }
    .msg.image img { max-width: 100%; border-radius: 8px; display: block; }
    .msg.image .cap { font-size: 12px; color: #8d84a8; padding: 6px 4px 2px; }
    form { display: flex; gap: 6px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #2a2140; align-items: center; }
    .fbtn {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid #2a2140; background: #171225;
      color: #b79aec; font-size: 16px; cursor: pointer; flex: none;
    }
    input#input {
      flex: 1; padding: 12px; border-radius: 22px; border: 1px solid #2a2140;
      background: #171225; color: #ece9f5; font-size: 15px; min-width: 0;
    }
    button#send {
      width: 44px; height: 44px; border-radius: 50%; border: 0; background: #7c3aed;
      color: #fff; font-size: 17px; cursor: pointer; flex: none;
    }
    button#send:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <header>
    <h1>💪 Meu Time IA</h1>
    <button id="webBtn" title="Pesquisar na internet">🌐</button>
    <button id="cfgBtn" title="Configurar">⚙️</button>
    <button id="clearBtn" title="Esquecer tudo">🗑</button>
  </header>
  <div id="setup" class="show">
    <h2>💪 Meu Time IA</h2>
    <p>Seu time de IAs pessoais: elas veem tudo que você fala, se ajudam, se lembram das conversas passadas e te dão dicas de treino e de qualquer assunto.<br /><br />
    Para funcionar: conta grátis em <a href="https://openrouter.ai" target="_blank" rel="noopener">openrouter.ai</a> → Keys → Create Key.</p>
    <input id="keyInput" type="password" placeholder="Cole sua chave OpenRouter (sk-or-...)" />
    <button id="saveKey">Salvar chave</button>
    <div id="botList"></div>
    <button id="startChat">Montar meu time 🚀</button>
  </div>
  <div id="chat"></div>
  <form id="form">
    <button type="button" class="fbtn" id="imgBtn" title="Gerar imagem grátis">🎨</button>
    <input id="input" placeholder="Ex: montar treino de hoje, braço e peito" autocomplete="off" />
    <button id="send">➤</button>
  </form>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
    const $ = (id) => document.getElementById(id);
    const API = "https://openrouter.ai/api/v1/chat/completions";
    const IMG_API = "https://image.pollinations.ai/prompt/";

    const BOTS = [
      { id: "deepseek/deepseek-chat-v3-0324:free", name: "DeepSeek", color: "#4d6bfe", desc: "Estrategista: monta treinos e explica o porquê" },
      { id: "mistralai/mistral-small-3.2-24b-instruct:free", name: "Mistral", color: "#ff7000", desc: "Motivador: energia e dicas práticas" },
      { id: "meta-llama/llama-3.3-70b-instruct:free", name: "Llama", color: "#0866ff", desc: "Cuidadoso: foco em saúde e recuperação" },
      { id: "qwen/qwen3-235b-a22b:free", name: "Qwen", color: "#6f4fd8", desc: "Detalhista: técnica de exercício e números" },
      { id: "google/gemma-3-27b-it:free", name: "Gemma", color: "#1a9e4b", desc: "Equilibrada: dieta e rotina" },
    ];

    let history = [];
    let selected = JSON.parse(localStorage.getItem("time-bots") || '["deepseek/deepseek-chat-v3-0324:free","mistralai/mistral-small-3.2-24b-instruct:free"]');
    let busy = false, stopFlag = false;

    function getKey() { return localStorage.getItem("openrouter-key"); }
    function researchOn() { return localStorage.getItem("time-research") === "1"; }

    function renderBotList() {
      const box = $("botList");
      box.innerHTML = "";
      BOTS.forEach((b) => {
        const row = document.createElement("label");
        row.className = "bot-pick" + (selected.includes(b.id) ? " on" : "");
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = selected.includes(b.id);
        cb.onchange = () => {
          if (cb.checked) { if (selected.length >= 4) { cb.checked = false; alert("Máximo 4 IAs no time."); return; } selected.push(b.id); }
          else selected = selected.filter((x) => x !== b.id);
          localStorage.setItem("time-bots", JSON.stringify(selected));
          renderBotList();
        };
        const info = document.createElement("div");
        info.innerHTML = '<div class="bp-name" style="color:' + b.color + '">' + b.name + "</div><div class=\"bp-desc\">" + b.desc + "</div>";
        row.append(cb, info);
        box.appendChild(row);
      });
    }

    function showSetup(show) {
      $("setup").classList.toggle("show", show);
      $("chat").style.display = show ? "none" : "flex";
      $("form").style.display = show ? "none" : "flex";
      $("webBtn").style.display = show ? "none" : "block";
    }

    $("saveKey").onclick = () => {
      const k = $("keyInput").value.trim();
      if (!k) return;
      localStorage.setItem("openrouter-key", k);
    };
    $("startChat").onclick = () => {
      if (!getKey()) { alert("Cola a chave do OpenRouter primeiro!"); return; }
      if (selected.length < 2) { alert("Escolhe pelo menos 2 IAs pro time!"); return; }
      showSetup(false);
    };
    $("cfgBtn").onclick = () => { $("keyInput").value = getKey() || ""; renderBotList(); showSetup(true); };
    $("clearBtn").onclick = () => {
      if (!confirm("Apagar TODA a memória das conversas? O time esquece tudo.")) return;
      history = [];
      localStorage.removeItem("time-history");
      $("chat").innerHTML = "";
    };
    $("webBtn").onclick = () => {
      const on = !researchOn();
      localStorage.setItem("time-research", on ? "1" : "0");
      $("webBtn").classList.toggle("on", on);
      alert(on ? "🌐 Pesquisa na internet LIGADA (usa um pouquinho de crédito do OpenRouter por resposta)."
               : "🌐 Pesquisa desligada (100% grátis de novo).");
    };

    function addMsg(kind, name, text, color) {
      const div = document.createElement("div");
      div.className = "msg " + kind;
      if (name) {
        const w = document.createElement("span");
        w.className = "who";
        w.style.color = color || "#fff";
        w.textContent = name;
        div.appendChild(w);
      }
      div.appendChild(document.createTextNode(text));
      $("chat").appendChild(div);
      $("chat").scrollTop = $("chat").scrollHeight;
      return div;
    }

    function addImage(url, cap) {
      const div = document.createElement("div");
      div.className = "msg image";
      const img = document.createElement("img");
      img.src = url;
      img.alt = cap;
      const c = document.createElement("div");
      c.className = "cap";
      c.textContent = "🎨 " + cap;
      div.append(img, c);
      $("chat").appendChild(div);
      $("chat").scrollTop = $("chat").scrollHeight;
      return div;
    }

    function load() {
      try { history = JSON.parse(localStorage.getItem("time-history") || "[]"); } catch { history = []; }
      history.forEach((m) => {
        if (m.kind === "image") addImage(m.url, m.content);
        else addMsg(m.kind, m.name, m.content, m.color);
      });
      if (history.length) $("chat").scrollTop = $("chat").scrollHeight;
      if (researchOn()) $("webBtn").classList.add("on");
    }
    function save() { localStorage.setItem("time-history", JSON.stringify(history.slice(-200))); }

    function messagesFor(botId, botName) {
      const msgs = [{
        role: "system",
        content: "Você é " + botName + ", parte do TIME de assistentes pessoais do usuário, junto com outras IAs. Papel do time: ajudar o usuário com treino de academia (foco principal), dieta e qualquer assunto da vida dele. Seu estilo: " + BOTS.find((b) => b.id === botId)?.desc + ". REGRAS: 1) Dê DICAS PRÁTICAS ao usuário, nunca converse com as outras IAs por diversão — elas são colegas de trabalho. 2) Você vê tudo que o usuário já falou antes, inclusive de conversas antigas: use isso pra lembrar dos objetivos dele. 3) Complemente o que os colegas disseram, sem repetir; se discordar, diga o porquê. 4) Seja CURTO: 1 a 5 frases (ou lista curta). 5) Se pedirem treino, especifique exercícios, séries e repetições. 6) Português brasileiro informal. 7) Se o assunto for saúde séria, recomende um profissional.",
      }];
      for (const m of history) {
        if (m.kind === "user") msgs.push({ role: "user", content: m.content });
        else if (m.kind === "image") msgs.push({ role: "user", content: "[Você gerou uma imagem: " + m.content + "]" });
        else if (m.name === botName) msgs.push({ role: "assistant", content: m.content });
        else msgs.push({ role: "user", content: "[" + m.name + " disse]: " + m.content });
      }
      return msgs;
    }

    async function callBot(bot, bubble) {
      const model = bot.id + (researchOn() ? ":online" : "");
      const res = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + getKey() },
        body: JSON.stringify({ model, messages: messagesFor(bot.id, bot.name), stream: true }),
      });
      if (res.status === 401) throw new Error("Chave do OpenRouter inválida. Toca no ⚙️ e confere.");
      if (res.status === 429) throw new Error("Deu limite grátis por agora, espera um pouquinho. ⏳");
      if (!res.ok) throw new Error("Erro da API (" + res.status + ").");
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "", full = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const parts = buffer.split("\n");
        buffer = parts.pop();
        for (const line of parts) {
          const t = line.trim();
          if (!t.startsWith("data:")) continue;
          const payload = t.slice(5).trim();
          if (payload === "[DONE]") continue;
          try {
            const delta = JSON.parse(payload).choices?.[0]?.delta?.content;
            if (delta) full += delta;
          } catch {}
        }
        if (full) {
          bubble.textContent = full;
          $("chat").scrollTop = $("chat").scrollHeight;
        }
      }
      if (!full) throw new Error("Resposta vazia.");
      return full;
    }

    async function runTurns() {
      if (busy) return;
      busy = true; stopFlag = false;
      $("send").disabled = true;
      for (const id of selected) {
        if (stopFlag) break;
        const bot = BOTS.find((b) => b.id === id);
        if (!bot) continue;
        const bubble = addMsg("bot typing", bot.name, "pensando...", bot.color);
        try {
          const full = await callBot(bot, bubble);
          bubble.classList.remove("typing");
          history.push({ kind: "bot", name: bot.name, content: full, color: bot.color });
          save();
        } catch (err) {
          bubble.classList.remove("typing");
          bubble.classList.add("error");
          bubble.textContent = err.message;
        }
      }
      busy = false;
      $("send").disabled = false;
    }

    $("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = $("input").value.trim();
      if (!text || busy) return;
      $("input").value = "";
      addMsg("user", null, text);
      history.push({ kind: "user", name: null, content: text });
      save();
      runTurns();
    });

    $("imgBtn").onclick = () => {
      const prompt = prompt("Descreva a imagem que você quer gerar (grátis):", "");
      if (!prompt || !prompt.trim()) return;
      const p = prompt.trim();
      const url = IMG_API + encodeURIComponent(p) + "?width=768&height=768&nologo=true&seed=" + Math.floor(Math.random() * 999999);
      addImage(url, p);
      history.push({ kind: "image", name: null, content: p, url });
      save();
    };

    if (getKey()) { renderBotList(); }
    load();
  </script>
</body>
</html>
