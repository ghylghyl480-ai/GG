<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Meu Clima</title>
<meta name="description" content="Meu Clima — tempo ao vivo da sua cidade, grátis e sem cadastro.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { --bg:#0b0f14; --card:#151b23; --line:#232c37; --txt:#e8edf2; --dim:#8b98a5; --acc:#f5a623; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; min-height:100dvh; overscroll-behavior-y:contain; }
  body { background:var(--bg); color:var(--txt); font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; padding:20px 16px; }
  h1 { font-size:22px; margin:8px 0 2px; }
  .sub { color:var(--dim); font-size:14px; margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; width:100%; max-width:380px; text-align:center; }
  #temp { font-size:64px; font-weight:700; line-height:1; }
  #desc { color:var(--dim); margin-top:6px; font-size:16px; }
  #extra { display:flex; justify-content:space-around; margin-top:16px; color:var(--dim); font-size:14px; }
  #extra b { color:var(--txt); display:block; font-size:18px; }
  .row { display:flex; gap:8px; width:100%; max-width:380px; margin-top:16px; }
  input { flex:1; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--txt); font-size:16px; }
  button { padding:12px 16px; border-radius:10px; border:0; background:var(--acc); color:#111; font-weight:700; font-size:16px; }
  .hrs { display:flex; gap:8px; overflow-x:auto; width:100%; max-width:380px; margin-top:16px; padding-bottom:4px; }
  .hr { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px; min-width:64px; text-align:center; font-size:14px; }
  .hr b { display:block; font-size:16px; }
  #loc { margin-top:10px; color:var(--dim); font-size:14px; }
  button, a, input, select { touch-action: manipulation; }
</style>
</head>
<body>
<h1>⛅ Meu Clima</h1>
<div class="sub">ao vivo, de graça, sem chave nenhuma</div>
<div class="card">
  <div id="temp">--°</div>
  <div id="desc">carregando...</div>
  <div id="extra">
    <div>Sensação<b id="sens">--°</b></div>
    <div>Vento<b id="vento">--</b></div>
    <div>Umidade<b id="umid">--%</b></div>
  </div>
</div>
<div id="loc"></div>
<div class="hrs" id="horas"></div>
<div class="row">
  <input id="cidade" placeholder="Digite sua cidade (ex: Recife)" />
  <button id="buscar">Buscar</button>
</div>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
const $ = (i) => document.getElementById(i);
const ICONES = { "0":"☀️","1":"🌤️","2":"⛅","3":"☁️","45":"🌫️","48":"🌫️","51":"🌦️","53":"🌦️","55":"🌦️","61":"🌧️","63":"🌧️","65":"🌧️","71":"🌨️","73":"🌨️","75":"🌨️","80":"🌦️","81":"🌧️","82":"🌧️","95":"⛈️","96":"⛈️","99":"⛈️" };
const NOMES = { "0":"céu limpo","1":"quase limpo","2":"parcialmente nublado","3":"nublado","45":"neblina","48":"neblina","51":"garoa","53":"garoa","55":"garoa","61":"chuva fraca","63":"chuva","65":"chuva forte","71":"neve","73":"neve","75":"neve forte","80":"pancadas","81":"pancadas","82":"pancadas fortes","95":"tempestade","96":"tempestade com granizo","99":"tempestade com granizo" };

async function geocod(nome) {
  const r = await fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(nome) + "&count=1&language=pt&format=json");
  const j = await r.json();
  if (!j.results || !j.results.length) throw new Error("Cidade não encontrada");
  const c = j.results[0];
  return { lat: c.latitude, lon: c.longitude, nome: c.name + (c.admin1 ? ", " + c.admin1 : "") };
}

async function carregar(lat, lon, nome) {
  $("desc").textContent = "carregando...";
  const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lon +
    "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m" +
    "&hourly=temperature_2m,weather_code&forecast_days=1&timezone=auto";
  const r = await fetch(url);
  const j = await r.json();
  const c = j.current;
  $("temp").textContent = Math.round(c.temperature_2m) + "°";
  $("desc").textContent = (ICONES[c.weather_code] || "🌡️") + " " + (NOMES[c.weather_code] || "tempo");
  $("sens").textContent = Math.round(c.apparent_temperature) + "°";
  $("vento").textContent = Math.round(c.wind_speed_10m) + "km/h";
  $("umid").textContent = c.relative_humidity_2m + "%";
  $("loc").textContent = "📍 " + nome;
  const agora = new Date().getHours();
  let html = "";
  const horas = j.hourly.time.map((t, i) => ({ h: new Date(t).getHours(), t: j.hourly.temperature_2m[i], w: j.hourly.weather_code[i] }))
    .filter((x) => x.h > agora).slice(0, 10);
  for (const x of horas) {
    html += '<div class="hr">' + (ICONES[x.w] || "🌡️") + "<b>" + Math.round(x.t) + "°</b>" + String(x.h).padStart(2, "0") + "h</div>";
  }
  $("horas").innerHTML = html;
  localStorage.setItem("clima-loc", JSON.stringify({ lat, lon, nome }));
}

(async () => {
  const salvo = JSON.parse(localStorage.getItem("clima-loc") || "null");
  if (salvo) { try { await carregar(salvo.lat, salvo.lon, salvo.nome); return; } catch (e) {} }
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      async (p) => { try { await carregar(p.coords.latitude, p.coords.longitude, "sua região"); } catch (e) { $("desc").textContent = "sem sinal, digite sua cidade"; } },
      () => { $("desc").textContent = "deixe eu ver onde você está, ou digite sua cidade"; }
    );
  }
})();

$("buscar").onclick = async () => {
  const nome = $("cidade").value.trim();
  if (!nome) return;
  $("desc").textContent = "procurando...";
  try {
    const c = await geocod(nome);
    await carregar(c.lat, c.lon, c.nome);
  } catch (e) { $("desc").textContent = "não achei essa cidade 😅"; }
};
$("cidade").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("buscar").click(); } });
</script>
</body>
</html>
